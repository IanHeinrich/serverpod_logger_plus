name: serverpod_logger_plus
description: >-
  Plug-and-play structured logging for Serverpod: dual-routes each log to
  Serverpod Insights and structured JSON on stdout for GCP, Datadog, Elastic,
  and more.
version: 0.3.2
homepage: https://github.com/IanHeinrich/serverpod_logger_plus
repository: https://github.com/IanHeinrich/serverpod_logger_plus
issue_tracker: https://github.com/IanHeinrich/serverpod_logger_plus/issues
license: MIT
topics:
  - serverpod
  - logging
  - observability
  - structured-logging
  - monitoring

environment:
  sdk: ^3.6.0

dependencies:
  serverpod: ^3.4.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
