# Publishes to pub.dev when a version tag (e.g. v1.2.3) is pushed.
#
# Tags are normally created by the release-please workflow when a release PR is
# merged, but pushing a matching tag by hand works too.
#
# Uses pub.dev's OIDC-based automated publishing: no tokens or secrets are
# stored here. Automated publishing must first be enabled on the package's
# pub.dev admin page (repository + tag pattern `v{{version}}`).
name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    permissions:
      id-token: write # required for OIDC authentication to pub.dev
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
