name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Run tests
        run: dart test

      # Catches packaging problems (missing files, bad pubspec, oversized
      # archive) on every PR instead of at release time.
      #
      # continue-on-error: `dart pub publish --dry-run` exits non-zero for
      # mere advisory warnings (e.g. git-state notices that are expected in a
      # shallow, detached-HEAD CI checkout), not just real packaging errors.
      # It shouldn't block merges by itself - read the step's output if it
      # ever reports something worth investigating.
      - name: Validate package
        run: dart pub publish --dry-run
        continue-on-error: true

  # The `test` job resolves the newest Serverpod in range. This one pins the
  # older end of the supported range so a change that relies on a newer
  # Serverpod API is caught here instead of by users on Serverpod 3.
  serverpod-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # "3.0.0" is the declared floor; the range resolves the newest 3.x.
        serverpod: ["3.0.0", ">=3.0.0 <4.0.0"]
    name: serverpod ${{ matrix.serverpod }}
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Pin Serverpod
        run: |
          dart pub add "serverpod:${{ matrix.serverpod }}"
          dart pub upgrade

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Run tests
        run: dart test

