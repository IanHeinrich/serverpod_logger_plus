name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Run tests
        run: dart test

      # Catches packaging problems (missing files, bad pubspec, oversized
      # archive) on every PR instead of at release time.
      #
      # continue-on-error: `dart pub publish --dry-run` exits non-zero for
      # mere advisory warnings (e.g. git-state notices that are expected in a
      # shallow, detached-HEAD CI checkout), not just real packaging errors.
      # It shouldn't block merges by itself - read the step's output if it
      # ever reports something worth investigating.
      - name: Validate package
        run: dart pub publish --dry-run
        continue-on-error: true
