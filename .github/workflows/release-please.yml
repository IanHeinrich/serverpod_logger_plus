# Maintains a "release" pull request that bumps the version and updates the
# changelog from Conventional Commits. Merging that PR tags a new release,
# which triggers the publish workflow.
#
# The token below must be a personal access token (secret RELEASE_PLEASE_TOKEN),
# NOT the default GITHUB_TOKEN: a tag pushed with GITHUB_TOKEN would not trigger
# the publish workflow.
name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
